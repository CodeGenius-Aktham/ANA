<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA - Orbe Verde Líquido</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldGlow: '#10b981',
                        emeraldDark: '#059669',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        /* Liquid Glass effect customized for clean white theme with green tones */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.25);
            box-shadow: 0 8px 32px 0 rgba(16, 185, 129, 0.08);
        }
        #voiceBtn.recording {
            background-color: #ef4444 !important;
            color: white !important;
            animation: pulseRec 1.2s infinite;
        }
        @keyframes pulseRec {
            0%   { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-emerald-500 selection:text-white">


    <p style="color: #16a34a; font-size: 0.875rem; text-align: center; margin-bottom: 1rem;">
        Esta version es una DEMO, por lo cual algunas funciones pueden no estar disponibles y otras pueden cometer errores.
    </p>
    <!-- Header vacío y limpio sin datos adicionales -->
    <header class="w-full p-6 flex justify-between items-center z-10">
        <div></div>
        <div></div>
    </header>

    <!-- Main Content: Orbe Verde y Subtítulos -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 -mt-12">
        
        <!-- Contenedor del Orbe -->
        <div class="relative w-72 h-72 sm:w-96 sm:h-96 flex items-center justify-center mb-10">
            <!-- Resplandor ambiental verde dinámico -->
            <div id="ambientGlow" class="absolute inset-0 rounded-full bg-emerald-400/20 blur-3xl transition-all duration-700 pointer-events-none scale-90"></div>
            
            <!-- Lienzo para la animación fluida tipo plastilina/líquido -->
            <canvas id="orbCanvas" class="w-full h-full cursor-pointer z-10"></canvas>
        </div>

        <!-- Proceso actual / Pensamiento -->
        <div class="h-8 flex items-center justify-center mb-4">
            <div id="thoughtProcess" class="text-xs sm:text-sm text-emerald-600 font-medium tracking-wide flex items-center space-x-2 transition-all duration-300 opacity-0">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-emerald-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span id="thoughtText">Procesando respuesta...</span>
            </div>
        </div>

        <!-- Subtítulos / Texto hablado con word-spacing adecuado -->
        <div class="max-w-2xl w-full text-center px-4 min-h-[5rem] flex items-center justify-center">
            <p id="subtitlesText" class="text-lg sm:text-2xl font-light text-slate-700 tracking-normal leading-relaxed transition-opacity duration-300 whitespace-pre-wrap">
                Hola, escribe tu consulta o habla directamente para comenzar.
            </p>
        </div>

    </main>

    <!-- Controls & Prompt Input Footer con Liquid Glass Verde y botones ordenados -->
    <footer class="w-full p-6 z-10 flex flex-col items-center">
        <div class="max-w-3xl w-full flex items-center gap-3 liquid-glass rounded-2xl p-2.5 transition-all focus-within:ring-2 focus-within:ring-emerald-500/30">
            <input type="text" id="userInput" placeholder="Escribe un mensaje..." 
                class="flex-1 bg-transparent border-none px-4 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none">
            
            <!-- Botón de Envío -->
            <button id="sendBtn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium p-3 rounded-xl text-sm transition-all shadow-md shadow-emerald-500/20 active:scale-95 flex items-center justify-center" title="Enviar">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>

            <!-- Botón de Voz / Micrófono a la derecha -->
            <button id="voiceBtn" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-medium p-3 rounded-xl text-sm transition-all active:scale-95 flex items-center justify-center" title="Hablar directamente">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
            </button>
        </div>
    </footer>

    <!-- Script de animación del orbe verde puro y estructura para conectar tu modelo -->
    <script>
        // Elementos UI
        const canvas = document.getElementById('orbCanvas');
        const ctx = canvas.getContext('2d');
        const subtitlesText = document.getElementById('subtitlesText');
        const thoughtProcess = document.getElementById('thoughtProcess');
        const thoughtText = document.getElementById('thoughtText');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const ambientGlow = document.getElementById('ambientGlow');

        // Configuración de Canvas Retina Display
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Estados del Orbe (siempre tonos verdes)
        let orbState = 'idle'; // idle, thinking, speaking
        let time = 0;
        let audioLevel = 0; 

        // Puntos de control para la plastilina/fluido verde orgánico
        const numPoints = 16;
        let points = [];
        for (let i = 0; i < numPoints; i++) {
            points.push({
                angle: (i / numPoints) * Math.PI * 2,
                offset: 0,
                velocity: Math.random() * 0.04 + 0.015
            });
        }

        // Bucle de renderizado del Orbe Verde
        function animateOrb() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const rect = canvas.getBoundingClientRect();
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            let baseRadius = Math.min(centerX, centerY) * 0.52;

            time += 0.025;

            let currentDeform = 10;
            let speedMultiplier = 1;

            if (orbState === 'idle') {
                currentDeform = 9;
                speedMultiplier = 0.9;
                ambientGlow.style.background = 'rgba(16, 185, 129, 0.18)';
            } else if (orbState === 'thinking') {
                currentDeform = 16;
                speedMultiplier = 2.2;
                ambientGlow.style.background = 'rgba(5, 150, 105, 0.25)';
            } else if (orbState === 'speaking') {
                currentDeform = 26 + (audioLevel * 22);
                speedMultiplier = 3.2;
                ambientGlow.style.background = 'rgba(52, 211, 153, 0.35)';
            }

            // Gradiente verde elegante para fondo blanco
            const gradient = ctx.createRadialGradient(centerX - 35, centerY - 35, 10, centerX, centerY, baseRadius * 1.35);
            gradient.addColorStop(0, '#34d399');    // Verde esmeralda claro brillante
            gradient.addColorStop(0.6, '#059669');  // Verde esmeralda intenso
            gradient.addColorStop(1, '#065f46');    // Sombra verde profunda

            ctx.save();
            ctx.beginPath();

            let coords = [];
            for (let i = 0; i < numPoints; i++) {
                let p = points[i];
                let noise = Math.sin(time * speedMultiplier + i * 1.2) * currentDeform;
                if (orbState === 'speaking') {
                    noise += (Math.random() - 0.5) * 14 * audioLevel;
                }
                let r = baseRadius + noise;
                let x = centerX + Math.cos(p.angle) * r;
                let y = centerY + Math.sin(p.angle) * r;
                coords.push({x, y});
            }

            ctx.moveTo((coords[0].x + coords[numPoints - 1].x) / 2, (coords[0].y + coords[numPoints - 1].y) / 2);
            for (let i = 0; i < numPoints; i++) {
                let curr = coords[i];
                let next = coords[(i + 1) % numPoints];
                let mx = (curr.x + next.x) / 2;
                let my = (curr.y + next.y) / 2;
                ctx.quadraticCurveTo(curr.x, curr.y, mx, my);
            }

            ctx.closePath();
            ctx.fillStyle = gradient;
            ctx.shadowColor = 'rgba(16, 185, 129, 0.4)';
            ctx.shadowBlur = 35;
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(animateOrb);
        }
        animateOrb();

        // ==========================================
        // ZONA DE CONEXIÓN CON TU MODELO DE IA
        // ==========================================
        async function conectarConMiModelo(promptTexto) {
            // 1. Mostrar estado pensando
            setOrbState('thinking');
            mostrarProceso(true, "Procesando solicitud...");

            try {
                // TODO: Conecta aquí tu modelo personalizado
                await new Promise(resolve => setTimeout(resolve, 2000));
                const respuestaIA = "Esta es una respuesta simulada de tu modelo de inteligencia artificial. Cada palabra se muestra perfectamente separada y legible.";

                // 2. Mostrar respuesta hablando con el orbe activo
                mostrarProceso(false);
                setOrbState('speaking');
                await efectoEscribirSubtitulos(respuestaIA);

            } catch (error) {
                console.error("Error al conectar con el modelo:", error);
                mostrarProceso(false);
                subtitlesText.innerText = "Error de conexión con el modelo.";
            } finally {
                setOrbState('idle');
            }
        }

        // Efecto visual palabra por palabra / letra por letra garantizando espacios limpios
        function efectoEscribirSubtitulos(texto) {
            return new Promise((resolve) => {
                subtitlesText.style.opacity = '0';
                setTimeout(() => {
                    subtitlesText.innerText = "";
                    subtitlesText.style.opacity = '1';
                    
                    let i = 0;
                    const velocidad = 20;
                    
                    function escribir() {
                        if (i < texto.length) {
                            subtitlesText.innerText += texto.charAt(i);
                            audioLevel = Math.sin(i * 0.4) * 0.5 + 0.5;
                            i++;
                            setTimeout(escribir, velocidad);
                        } else {
                            audioLevel = 0;
                            resolve();
                        }
                    }
                    escribir();
                }, 200);
            });
        }

        function setOrbState(state) {
            orbState = state;
        }

        function mostrarProceso(mostrar, texto = "Procesando...") {
            if (mostrar) {
                thoughtText.innerText = texto;
                thoughtProcess.classList.remove('opacity-0');
            } else {
                thoughtProcess.classList.add('opacity-0');
            }
        }

        // Eventos de interacción
        sendBtn.addEventListener('click', () => {
            const texto = userInput.value.trim();
            if (texto) {
                userInput.value = "";
                conectarConMiModelo(texto);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });

        // ==========================================
        // RECONOCIMIENTO DE VOZ REAL (Web Speech API)
        // Transcribe lo que el usuario dice al input,
        // y al detectar que dejó de hablar, envía automáticamente.
        // ==========================================
        const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognitionAPI) {
            recognition = new SpeechRecognitionAPI();
            recognition.lang = 'es-ES';
            recognition.continuous = true;      // sigue escuchando aunque haya pausas cortas
            recognition.interimResults = true;  // muestra la transcripción en vivo mientras habla
            recognition.maxAlternatives = 1;

            let finalTranscript = '';

            recognition.onstart = () => {
                isRecording = true;
                finalTranscript = '';
                userInput.value = '';
                voiceBtn.classList.add('recording');
                subtitlesText.innerText = "Escuchando... habla ahora.";
                setOrbState('thinking');
                mostrarProceso(true, "Escuchando audio...");
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                // Refleja en vivo, de forma correcta y eficiente, lo dicho en el campo de texto
                userInput.value = (finalTranscript + interimTranscript).trim();
            };

            recognition.onerror = (event) => {
                console.error("Error de reconocimiento de voz:", event.error);
                mostrarProceso(false);
                setOrbState('idle');
                voiceBtn.classList.remove('recording');
                isRecording = false;
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    subtitlesText.innerText = "Permiso de micrófono denegado. Actívalo para hablar con el asistente.";
                } else if (event.error === 'no-speech') {
                    subtitlesText.innerText = "No se detectó voz. Intenta de nuevo.";
                } else {
                    subtitlesText.innerText = "Error al capturar audio.";
                }
            };

            recognition.onend = () => {
                isRecording = false;
                voiceBtn.classList.remove('recording');
                mostrarProceso(false);

                const texto = userInput.value.trim();
                if (texto) {
                    // Al finalizar de hablar, se envía automáticamente
                    userInput.value = "";
                    conectarConMiModelo(texto);
                } else {
                    setOrbState('idle');
                }
            };

            voiceBtn.addEventListener('click', () => {
                if (isRecording) {
                    recognition.stop(); // detener manualmente dispara onend -> auto-envío si hay texto
                } else {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error("No se pudo iniciar el reconocimiento:", e);
                    }
                }
            });
        } else {
            // Navegador sin soporte para Web Speech API
            voiceBtn.addEventListener('click', () => {
                subtitlesText.innerText = "Tu navegador no soporta reconocimiento de voz. Prueba con Chrome.";
            });
        }
    </script>
</body>
</html>
